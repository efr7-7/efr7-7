name: cards
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    paths: ["kit/**"]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node kit/render.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898599+github-actions[bot]@users.noreply.github.com"
          git add *.svg
          git diff --cached --quiet || (git commit -m "refresh cards" && git push)
